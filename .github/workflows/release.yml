name: Release

# Todo push na main roda os testes, gera o executável e publica uma nova versão.
on:
  push:
    branches: [main]

permissions:
  contents: write

# Uma release por vez, para que cada execução enxergue a tag criada pela anterior.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Testes
        run: python -m unittest -v

      - name: Calcular versão
        id: versao
        run: bash .github/scripts/proxima-versao.sh | tee -a "$GITHUB_OUTPUT"

      - name: Gerar executável
        if: steps.versao.outputs.versao != ''
        run: |
          python -m pip install pyinstaller==6.22.3
          python -m PyInstaller --noconfirm --onefile --windowed --name DecifradorCesarGrupo4 main.py
          cp dist/DecifradorCesarGrupo4.exe "dist/DecifradorCesarGrupo4-v${{ steps.versao.outputs.versao }}.exe"

      - name: Notas da versão
        if: steps.versao.outputs.versao != ''
        env:
          ANTERIOR: ${{ steps.versao.outputs.anterior }}
        run: |
          intervalo="${ANTERIOR:+$ANTERIOR..}HEAD"
          {
            echo "## Alterações"
            echo
            git log --no-merges --format='- %s (%h)' "$intervalo"
            echo
            echo "## Como usar"
            echo
            echo "Baixe o \`.exe\` abaixo e abra com dois cliques (não precisa ter Python instalado)."
          } > notas.md
          cat notas.md

      - name: Criar release
        if: steps.versao.outputs.versao != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSAO: ${{ steps.versao.outputs.versao }}
        run: |
          gh release create "v$VERSAO" "dist/DecifradorCesarGrupo4-v$VERSAO.exe" \
            --target "$GITHUB_SHA" \
            --title "v$VERSAO" \
            --notes-file notas.md
